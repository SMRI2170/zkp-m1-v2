name: Week27 RSSI audit
on:
  push:
    paths:
      - 'experiments/week27-data-audit/**'
      - 'week27/**'
      - '.github/workflows/week27-rssi.yml'
  pull_request:
    paths:
      - 'experiments/week27-data-audit/**'
      - 'week27/**'
      - '.github/workflows/week27-rssi.yml'
  workflow_dispatch:
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install numerical test dependency
        run: python -m pip install numpy==2.5.4
      - name: Test geometry, calibration boundaries and cancellation counterexample
        run: python -m unittest discover -s experiments/week27-data-audit -p 'test_*.py'
      - name: Verify aggregate evidence without downloading raw data
        run: python experiments/week27-data-audit/audit_paired_results.py week27/results/paired-attacks-20261103-v2
      - name: Verify model-error, power-cap and temporal sensitivity evidence
        run: python experiments/week27-data-audit/audit_sensitivity_results.py week27/results/compensation-sensitivity-20261103
      - name: Verify condition-block uncertainty and external data audit accounting
        run: python experiments/week27-data-audit/audit_external_validity.py
      - name: Verify same-frame four-station SNR aggregate evidence
        run: python experiments/week27-data-audit/audit_snr_four_station.py
      - name: Verify normal SNR model splits and calibration evidence
        run: python experiments/week27-data-audit/audit_snr_normal_model.py
      - name: Verify Dataset-21 local-file audit evidence (raw GPS/RSS not read)
        run: python experiments/week27-data-audit/audit_aerpaw21_results.py week27/results/dataset21-local-audit-20261108-b
      - name: Verify Dataset-21 input experiment and NOT_RUN detection gates
        run: python experiments/week27-data-audit/audit_dataset21_eval_results.py week27/results/dataset21-eval-20261108-e
  dataset21-adapter-numerics:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 scipy==1.16.3
      - name: Test numerical adapter including synthetic D1 and GhostBuster fixtures
        run: python -m unittest discover -s experiments/week27-data-audit -p test_dataset21_adapter.py -v
