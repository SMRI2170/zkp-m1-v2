name: Signed observation statement interoperability
on:
  push:
    paths:
      - 'experiments/signed-observation-interop/**'
      - 'week24/logs/signed-observation-interop/**'
      - 'week24/manifests/signed-observation-interop.json'
      - 'week24/11_*'
      - '.github/workflows/signed-observation-interop.yml'
  pull_request:
    paths:
      - 'experiments/signed-observation-interop/**'
      - 'week24/logs/signed-observation-interop/**'
      - 'week24/manifests/signed-observation-interop.json'
      - 'week24/11_*'
      - '.github/workflows/signed-observation-interop.yml'
jobs:
  native-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
      - name: Install pinned Rust and RISC-V target
        run: rustup toolchain install 1.97.1 --profile minimal --target riscv64imac-unknown-none-elf
      - name: Test canonical field and curve constants
        run: cargo +1.97.1 test --manifest-path experiments/signed-observation-interop/core/Cargo.toml --locked -j 1
      - name: Re-run Go to Rust comparison with RAM-only synthetic assignments
        run: python3 experiments/signed-observation-interop/run.py --out "$RUNNER_TEMP/interop-run"
      - name: Check no_std RISC-V library without claiming a VM proof
        run: cargo +1.97.1 check --manifest-path experiments/signed-observation-interop/core/Cargo.toml --lib --target riscv64imac-unknown-none-elf --locked -j 1
      - name: Validate recorded evidence and unverified boundaries
        run: python3 experiments/signed-observation-interop/check_results.py
