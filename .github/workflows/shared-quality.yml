name: Shared ZKP and universal quality

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: shared-zkp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proof-and-contracts:
    uses: SMRI2170/SMRI2170/.github/workflows/reusable-zkp.yml@7cdeb265e17900c8475685198d19ff029bd51cda
    permissions:
      contents: read
    with:
      go_directory: aggregator
      contracts_directory: contracts
      run_race_detector: false
  quality:
    uses: SMRI2170/SMRI2170/.github/workflows/reusable-quality.yml@e2eb51b805e13d6329a0197243d4d1e54fed1018
    permissions:
      contents: read
      pull-requests: read
      actions: read
