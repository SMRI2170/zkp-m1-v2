name: Verify

on:
  push:
  pull_request:

jobs:
  contracts-and-aggregator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
      - name: Install contract dependencies
        working-directory: contracts
        run: npm ci
      - name: Run contract tests
        working-directory: contracts
        run: npm test
      - name: Run observer capture and RSSI evaluation tests
        run: python3 -m unittest discover -s uav -p 'test_*.py'
      - name: Run Go tests
        working-directory: aggregator
        run: go test ./...
      - name: Run Euclidean integer circuit tests
        working-directory: experiments/pi4-euclidean/gnark
        run: go test ./...
      - name: Validate recorded Pi Euclidean experiment evidence
        run: python3 experiments/pi4-euclidean/check_results.py
      - name: Validate additional Pi framework evaluation evidence
        run: python3 experiments/pi4-euclidean-additional/check_results.py
      - name: Test telemetry failure cleanup
        run: python3 -m unittest discover -s experiments/pi4-euclidean-additional -p "test_*.py"
