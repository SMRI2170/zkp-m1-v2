name: Verify

on:
  push:
  pull_request:

jobs:
  contracts-and-aggregator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
      - name: Install contract dependencies
        working-directory: contracts
        run: npm ci
      - name: Run contract tests
        working-directory: contracts
        run: npm test
      - name: Run observer capture and RSSI evaluation tests
        run: python3 -m unittest discover -s uav -p 'test_*.py'
      - name: Run Go tests
        working-directory: aggregator
        run: go test ./...
      - name: Run Euclidean integer circuit tests
        working-directory: experiments/pi4-euclidean/gnark
        run: go test ./...
      - name: Validate recorded Pi Euclidean experiment evidence
        run: python3 experiments/pi4-euclidean/check_results.py
      - name: Validate additional Pi framework evaluation evidence
        run: python3 experiments/pi4-euclidean-additional/check_results.py
      - name: Test telemetry failure cleanup
        run: python3 -m unittest discover -s experiments/pi4-euclidean-additional -p "test_*.py"
      - name: Validate followup framework evaluation evidence
        run: python3 experiments/pi4-euclidean-followup/check_results.py
      - name: Test host proof memory guard
        run: python3 -m unittest discover -s experiments/pi4-euclidean-followup -p "test_*.py"
      - name: Validate Kimchi Binius64 and Jolt evaluation evidence
        run: python3 experiments/pi4-euclidean-next/check_results.py
      - name: Test expanded observation workload bindings
        working-directory: experiments/pi4-euclidean-evaluation/workload
        run: go test ./...
      - name: Test evaluation data normalization and memory cleanup
        run: python3 -m unittest discover -s experiments/pi4-euclidean-evaluation -p "test_*.py"
      - name: Validate expanded evaluation evidence
        run: python3 experiments/pi4-euclidean-evaluation/check_results.py
      - name: Validate Mac observation followup and stopped trials
        run: python3 experiments/pi4-observation-followup/check_results.py
      - name: Test Pi preflight and fail-closed launch
        run: python3 -m unittest discover -s experiments/pi4-stability -p "test_*.py"
      - name: Test extra signed workload integer boundaries and signer bindings
        run: python3 experiments/pi4-binding-tests/run.py
      - name: Validate Pi n4 completion and stability evidence
        run: python3 experiments/pi4-stability/check_results.py
