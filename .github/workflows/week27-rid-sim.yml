name: Week27 RID simulator adapter
on:
  push:
    paths:
      - 'experiments/week27-rid-sim/**'
      - 'week27/11_*'
      - 'week27/12_*'
      - 'week27/13_*'
      - 'week27/14_*'
      - 'week27/15_*'
      - 'week27/results/uli-net-sim-*/**'
      - 'week27/results/observer-attack-*/**'
      - 'week27/**'
      - '.github/workflows/week27-rid-sim.yml'
  pull_request:
    paths:
      - 'experiments/week27-rid-sim/**'
      - 'week27/11_*'
      - 'week27/12_*'
      - 'week27/13_*'
      - 'week27/14_*'
      - 'week27/15_*'
      - 'week27/results/uli-net-sim-*/**'
      - 'week27/results/observer-attack-*/**'
      - 'week27/**'
      - '.github/workflows/week27-rid-sim.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adapter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test event alignment, missing RSSI and denominators (synthetic unit fixtures)
        run: python -m unittest discover -s experiments/week27-rid-sim/tests -v
      - name: Check script syntax
        run: |
          bash -n experiments/week27-rid-sim/scripts/build_headless.sh
          python -m compileall -q experiments/week27-rid-sim/scripts
      - name: Audit recorded PR4 aggregate counts and seed splits (no RF execution)
        run: python experiments/week27-rid-sim/scripts/validate_evidence.py week27/results/uli-net-sim-evaluation-20261108-full-b
      - name: Audit recorded PR5 attack, PHY, seed and solver evidence (no RF execution)
        run: python experiments/week27-rid-sim/scripts/validate_observer_attack.py week27/results/observer-attack-full-20261108-a week27/results/observer-attack-mlat-20261108-a
      - name: Audit recorded PR6a geometry and frozen plan (no RF execution)
        run: python experiments/week27-rid-sim/scripts/validate_external.py week27/results/issue77-6a-20261108-a week27/results/issue77-plan-20261108/plan.json
      # This job does not install OMNeT++/INET or claim an RF simulation ran.
  ghostbuster-numerics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numerical reference dependencies
        run: python -m pip install numpy==2.2.6 scipy==1.16.3
      - name: Verify GhostBuster equations, numerical solver and failure cases
        run: python -m unittest discover -s experiments/week27-rid-sim/tests -p test_ghostbuster.py -v
      - name: Audit stored GhostBuster results (no new RF execution)
        run: >-
          python experiments/week27-rid-sim/scripts/validate_ghostbuster.py
          week27/results/ghostbuster-20261108-c
          week27/results/ghostbuster-native-20261108-c
          week27/results/ghostbuster-counterfactual-20261108-c
