# Original integration configuration using upstream public NED interfaces.
# A 4-second smoke, not a calibrated RF experiment or ASTM byte-level RID.
[General]
network = uav_rid.rid_network.BasicUav
sim-time-limit = 4s
cmdenv-express-mode = true
cmdenv-interactive = false
record-eventlog = false
**.vector-recording = true
*.hasVisualizer = false
*.numHosts = 3
*.numGcs = 1
*.gcs[0].pyClass = "smoke_callback.SmokeAudit"
*.pyBridge.pythonPath = "@CALLBACK_PATH@"
*.host[*].wlan[0].mgmt.gcsModulePath = "^.^.^.gcs[0]"
*.host[*].wlan[0].mgmt.beaconInterval = 500ms
*.host[*].wlan[0].mgmt.startupJitter = 0s
*.host[*].wlan[0].mgmt.beaconOffset = 100ms
*.host[*].wlan[0].radio.transmitter.power = 13dBm
*.host[*].mobility.initFromDisplayString = false
*.host[0].wlan[0].mgmt.transmitBeacon = false
*.host[2].wlan[0].mgmt.transmitBeacon = false
*.host[0].mobility.typename = "StationaryMobility"
*.host[0].mobility.initialX = 100m
*.host[0].mobility.initialY = 100m
*.host[0].mobility.initialZ = 2m
*.host[2].mobility.typename = "StationaryMobility"
*.host[2].mobility.initialX = 200m
*.host[2].mobility.initialY = 100m
*.host[2].mobility.initialZ = 2m
*.host[1].mobility.typename = "LinearMobility"
*.host[1].mobility.initialX = 150m
*.host[1].mobility.initialY = 100m
*.host[1].mobility.initialZ = 40m
*.host[1].mobility.initialMovementHeading = 90deg
*.host[1].mobility.initialMovementElevation = 0deg
*.host[1].mobility.speed = 3mps

[Config Normal]

[Config StaticSpoof]
*.host[1].typename = "StaticLocationSpooferHost"
*.host[1].wlan[0].mgmt.spoofPosX = 250
*.host[1].wlan[0].mgmt.spoofPosY = 100
*.host[1].wlan[0].mgmt.spoofPosZ = 40
